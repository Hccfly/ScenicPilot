[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenic-pilot"
version = "1.0.0"
description = "An auditable scenic-area assistant for grounded Q&A and constraint-aware itinerary planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jieba>=0.42,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4.0",
  "numpy>=2.3,<3.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ingest = [
  "playwright>=1.55,<2.0",
  "selectolax>=0.3,<1.0",
  "trafilatura>=2.0,<3.0",
]
retrieval = [
  "sentence-transformers>=5.0,<6.0",
]

[project.scripts]
scenic-pilot = "scenic_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["scenic_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
